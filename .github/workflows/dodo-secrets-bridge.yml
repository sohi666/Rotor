name: Copy secrets to Dodo Planet

# One-time helper. Runs on GitHub's servers: copies Rotor's store credentials into
# sohi666/dodo-planet and creates Dodo Planet's own match passphrase and Android
# upload key there. Values go from GitHub to GitHub and are never printed.
# Needs the Rotor secret DODO_BRIDGE_TOKEN: a fine-grained token with
# "Secrets: Read and write" on sohi666/dodo-planet only. Delete the token, this
# branch and this file afterwards.
on:
  push:
    branches: [dodo-secrets-bridge]

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.DODO_BRIDGE_TOKEN }}
      TARGET: sohi666/dodo-planet
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      REVIEW_PHONE: ${{ secrets.REVIEW_PHONE }}
      DODO_ASC_APP_ID: ''   # filled in once the App Store Connect app record exists
    steps:
      - name: Copy and create secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "DODO_BRIDGE_TOKEN is not set in Rotor yet; nothing copied."
            exit 0
          fi
          existing="$(gh secret list --repo "$TARGET" --json name --jq '.[].name')"
          put() { printf '%s' "$2" | gh secret set "$1" --repo "$TARGET"; echo "set $1"; }
          has() { grep -qx "$1" <<<"$existing"; }

          for n in ASC_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID GOOGLE_SERVICE_ACCOUNT_JSON REVIEW_PHONE; do
            if [[ -n "${!n}" ]]; then put "$n" "${!n}"; else echo "::warning::Rotor has no $n"; fi
          done
          put NTFY_TOPIC "dodo-sb-szoog180"
          [[ -n "$DODO_ASC_APP_ID" ]] && put ASC_APP_ID "$DODO_ASC_APP_ID"

          if ! has MATCH_PASSWORD; then put MATCH_PASSWORD "$(openssl rand -base64 33)"; fi

          if ! has ANDROID_KEYSTORE_BASE64; then
            pw="$(openssl rand -hex 24)"
            keytool -genkeypair -keystore upload.keystore -storetype PKCS12 -alias dodo-upload \
              -keyalg RSA -keysize 4096 -validity 10000 -storepass "$pw" -keypass "$pw" \
              -dname "CN=Consultation Behtoyi Inc., O=Consultation Behtoyi Inc., L=Montreal, ST=QC, C=CA" >/dev/null 2>&1
            put ANDROID_KEYSTORE_BASE64 "$(base64 -w0 upload.keystore)"
            put ANDROID_KEYSTORE_PASSWORD "$pw"
            put ANDROID_KEY_ALIAS "dodo-upload"
            mkdir -p backup
            cp upload.keystore backup/dodo-upload.keystore
            printf 'Dodo Planet Android upload key\nalias: dodo-upload\npassword: %s\nKeep this file and password in your password manager, then delete this artifact.\n' "$pw" > backup/README.txt
          fi
          echo "Secrets now in $TARGET:"
          gh secret list --repo "$TARGET" --json name --jq '.[].name'

      - name: Upload-key backup (download once, then delete)
        if: ${{ hashFiles('backup/dodo-upload.keystore') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: dodo-upload-key-backup
          path: backup/
          retention-days: 3
