name: App Store page setup

# Fills the App Store version page without a new build or a review submission:
# description, keywords, URLs, screenshots (iPhone + iPad), age rating, categories
# (fastlane ios metadata), then price Free, worldwide availability and the App Review
# contact (scripts/asc-setup.mjs). App Privacy has no API: answer it in App Store Connect.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: setup = fill the page; check-review = only ask Apple what still blocks App Review (changes nothing); review-notes = send review notes + attachment only; resubmit = the same, then resubmit after an App Review reply
        type: choice
        options: [setup, check-review, review-notes, resubmit]
        default: setup
      review_phone:
        description: App Review contact phone, e.g. +1 514 555 0100 (only Apple sees it; empty = leave as is)
        required: false
        type: string
      review_email:
        description: App Review contact email
        required: false
        type: string
        default: support@cibinc.ca
      review_attachment:
        description: resubmit mode - file in the repo to attach to the App Review information (e.g. the screen recording)
        required: false
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
      ASC_APP_URL: https://appstoreconnect.apple.com/apps/${{ secrets.ASC_APP_ID }}
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_OPT_OUT_USAGE: 'YES'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check store metadata
        run: node scripts/check-store-metadata.mjs
      - name: Write App Store Connect key
        run: bash scripts/ci/write-secrets.sh ios
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: What still blocks App Review (API, changes nothing)
        id: check
        if: inputs.mode == 'check-review'
        run: node scripts/asc-setup.mjs --only=ageRatingSchema,reviewReadiness 2>&1 | tee "$RUNNER_TEMP/asc-check.log"
      - name: App Review notes and attachment, then resubmit (API)
        id: resubmit
        if: inputs.mode == 'resubmit' || inputs.mode == 'review-notes'
        env:
          MODE: ${{ inputs.mode }}
          REVIEW_PHONE: ${{ inputs.review_phone }}
          REVIEW_EMAIL: ${{ inputs.review_email }}
          REVIEW_ATTACHMENT: ${{ inputs.review_attachment }}
        run: |
          if [[ -z "$REVIEW_PHONE" ]]; then
            echo "::error::review_phone is required: Apple only accepts the notes together with name, phone and email."
            exit 1
          fi
          steps=reviewContact,reviewAttachment
          [[ "$MODE" == "resubmit" ]] && steps="$steps,resubmit"
          node scripts/asc-setup.mjs --only=$steps 2>&1 | tee "$RUNNER_TEMP/asc-resubmit.log"
      - name: Price, availability and App Review contact (API)
        id: api
        if: inputs.mode == 'setup'
        env:
          REVIEW_PHONE: ${{ inputs.review_phone }}
          REVIEW_EMAIL: ${{ inputs.review_email }}
        run: node scripts/asc-setup.mjs 2>&1 | tee "$RUNNER_TEMP/asc-setup.log"
      - name: Upload metadata, screenshots and age rating (fastlane ios metadata)
        id: meta
        if: always() && inputs.mode == 'setup'
        env:
          REVIEW_PHONE: ${{ inputs.review_phone }}
          REVIEW_EMAIL: ${{ inputs.review_email }}
        run: bundle exec fastlane ios metadata 2>&1 | tee "$RUNNER_TEMP/fastlane-ios.log"
      - name: Notify
        if: always()
        env:
          META: ${{ steps.meta.outcome }}
          API: ${{ steps.api.outcome }}
          CHECK: ${{ steps.check.outcome }}
          RESUBMIT: ${{ steps.resubmit.outcome }}
          MODE: ${{ inputs.mode }}
        run: |
          if [[ "$RESUBMIT" == "success" && "$MODE" == "review-notes" ]]; then
            bash scripts/notify.sh "Rotor App Review notes updated" "Notes (and attachment, if any) are in App Store Connect. Nothing was resubmitted." default memo "$ASC_APP_URL/distribution"
          elif [[ "$RESUBMIT" == "success" ]]; then
            bash scripts/notify.sh "Rotor iOS resubmitted to App Review" "Review notes and the attachment were sent, and the submission went back to Apple." default inbox_tray "$ASC_APP_URL/distribution"
          elif [[ "$RESUBMIT" == "failure" ]]; then
            bash scripts/notify.sh "ACTION NEEDED: App Review resubmission failed" "$(grep -oE 'FAILED: .*' "$RUNNER_TEMP/asc-resubmit.log" | head -2 | paste -sd ';' -)" high warning "$RUN_URL"
          elif [[ "$CHECK" == "success" ]]; then
            bash scripts/notify.sh "Rotor iOS is ready for App Review" "Apple accepts the version for review. Run Release with ios_review_only = true." default white_check_mark "$RUN_URL"
          elif [[ "$CHECK" == "failure" ]]; then
            blockers="$(grep -oE 'review blocker ERROR: .*' "$RUNNER_TEMP/asc-check.log" | cut -c23- | head -5 | paste -sd ';' -)"
            bash scripts/notify.sh "ACTION NEEDED: App Review blockers" "${blockers:-Open the run log.}" high warning "$ASC_APP_URL/distribution"
          elif [[ "$META" == "success" && "$API" == "success" ]]; then
            bash scripts/notify.sh "Rotor App Store page filled" \
              "Description, keywords, URLs, screenshots, age rating, price (Free) and availability are set. Left for you: App Privacy (No data collected, then Publish)." \
              default white_check_mark "$ASC_APP_URL/distribution"
          else
            bash scripts/notify.sh "Rotor App Store page setup FAILED" "metadata: ${META}, price/availability/contact: ${API}. Open the run log." high warning "$RUN_URL"
          fi
      - name: Remove key files
        if: always()
        run: bash scripts/ci/write-secrets.sh cleanup
