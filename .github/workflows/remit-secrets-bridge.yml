name: Copy secrets to Remit North

# One-time helper. Runs on GitHub's servers: copies Rotor's store credentials into
# sohi666/remit-north. Values go from GitHub to GitHub and are never printed.
# Needs the Rotor secret REMIT_BRIDGE_TOKEN: a fine-grained token with
# "Secrets: Read and write" + "Actions: Read and write" on sohi666/remit-north and
# "Contents: Read and write" on sohi666/remit-north-info. The same token becomes Remit North's
# INFO_REPO_TOKEN (tables feed). Delete this branch afterwards.
on:
  push:
    branches: [remit-secrets-bridge]

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.REMIT_BRIDGE_TOKEN }}
      TARGET: sohi666/remit-north
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      REVIEW_PHONE: ${{ secrets.REVIEW_PHONE }}
      INFO_REPO_TOKEN: ${{ secrets.REMIT_BRIDGE_TOKEN }}
      NTFY: ${{ secrets.NTFY_TOPIC }}
    steps:
      - name: Copy secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::warning::REMIT_BRIDGE_TOKEN is not set in Rotor yet; nothing copied."
            exit 0
          fi
          put() { printf '%s' "$2" | gh secret set "$1" --repo "$TARGET"; echo "set $1"; }
          for n in EXPO_TOKEN ASC_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID GOOGLE_SERVICE_ACCOUNT_JSON REVIEW_PHONE INFO_REPO_TOKEN; do
            if [[ -n "${!n}" ]]; then put "$n" "${!n}"; else echo "::warning::Rotor has no $n"; fi
          done
          put NTFY_TOPIC "remitnorth-sb-9995db9d5cd0"
          echo "Secrets now in $TARGET:"
          gh secret list --repo "$TARGET" --json name --jq '.[].name'
          # Start Remit North's one-time EAS project setup now that EXPO_TOKEN exists.
          gh workflow run eas-init.yml --repo "$TARGET" --ref main || echo "::warning::could not start eas-init; run it from the Actions tab"
      - name: Tell Sohrab (Rotor's ntfy topic)
        if: always()
        shell: bash
        run: |
          [[ -z "$NTFY" ]] && exit 0
          curl -sS -m 15 -H "Title: Remit North secrets copied" -H "Tags: key" -d "Store credentials are now in sohi666/remit-north. Subscribe to ntfy topic remitnorth-sb-9995db9d5cd0 for Remit North alerts." "https://ntfy.sh/$NTFY" >/dev/null || true
